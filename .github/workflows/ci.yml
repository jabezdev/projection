name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*", "obs-v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (Rust and operator UI)
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: System packages
        working-directory: /
        run: pacman -Syyuu --noconfirm --needed base-devel git clang rustup ffmpeg webkit2gtk-4.1 gtk3 alsa-lib vulkan-swrast vulkan-icd-loader ttf-liberation unzip pipewire nodejs
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Rust toolchain
        run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-
      - name: Operator UI build, lint and test
        working-directory: desktop/crates/app/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun run test
      - name: Rust tests
        run: cargo test --workspace --locked

  web:
    name: Web (typecheck and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  obs:
    name: OBS plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obs
    steps:
      - uses: actions/checkout@v4
      - name: libobs
        run: sudo apt-get update && sudo apt-get install -y libobs-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            obs/target
          key: obs-${{ hashFiles('obs/Cargo.lock') }}
          restore-keys: obs-
      - run: cargo test --locked

  obs-release:
    name: OBS plugin release
    if: startsWith(github.ref, 'refs/tags/obs-v')
    needs: [obs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm libarchive-tools
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.txt
      - name: Build the plugin
        run: obs/tools/build-windows.sh
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: |
            obs/target/dist/*.zip
            obs/target/dist/*-setup.exe

  windows-installer:
    name: Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Already released?
        id: existing
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -q -- '-setup.exe$'; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.existing.outputs.released != 'true'
      - name: Cross-build tools
        if: steps.existing.outputs.released != 'true'
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm libarchive-tools
      - name: Release notes
        if: steps.existing.outputs.released != 'true'
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.txt
      - name: Build the installer
        if: steps.existing.outputs.released != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: RELEASE_NOTES="$(cat release-notes.txt)" desktop/tools/build-windows.sh --no-bump
      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.released != 'true'
        with:
          body_path: release-notes.txt
          files: |
            desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json
