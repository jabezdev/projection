[workspace]
members = [
    "crates/app",
    "crates/core_engine",
    "crates/network_server",
    "crates/persistence",
    "crates/protocol",
    "crates/render_engine",
    "crates/media_engine"
]
resolver = "2"

[workspace.dependencies]
wgpu = "30.0"
cpal = "0.18"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
crossbeam = "0.8"
# Only what playback and posters use, so packages ship fewer FFmpeg libraries.
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
rusqlite = { version = "0.40", features = ["bundled"] }
pollster = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1.19", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
tauri = { version = "2.12" }
tauri-build = { version = "2.7" }

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1 # Better performance for graphics even in dev
