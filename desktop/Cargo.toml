[workspace]
members = [
    "crates/app",
    "crates/core_engine",
    "crates/network_server",
    "crates/persistence",
    "crates/protocol"
]
resolver = "2"

[workspace.dependencies]
wgpu = "22.1"
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"
rodio = "0.19"
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
crossbeam = "0.8"
ffmpeg-next = "8.1"
rusqlite = { version = "0.32", features = ["bundled"] }
pollster = "0.4.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1.19", features = ["derive"] }
glam = "0.29"
glyphon = "0.6" # Text rendering natively on wgpu
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
tauri = { version = "2.11.1" }
tauri-build = { version = "2.6.1" }
tauri-plugin-log = "2"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1 # Better performance for graphics even in dev
