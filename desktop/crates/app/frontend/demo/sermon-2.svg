<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect width="1920" height="1080" fill="#f7f5f0"/><text x="160" y="250" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="84" font-weight="700" fill="#14181d">1. He provides</text><text x="160" y="330" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="42" font-style="italic" fill="#c2410c">“I shall not want”</text><rect x="160" y="470" width="18" height="18" fill="#c2410c"/><text x="210" y="490" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="52" fill="#1f2937">Provision is a person before it is a thing</text><rect x="160" y="620" width="18" height="18" fill="#c2410c"/><text x="210" y="640" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="52" fill="#1f2937">Rest is commanded, not earned</text><rect x="160" y="770" width="18" height="18" fill="#c2410c"/><text x="210" y="790" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="52" fill="#1f2937">Still waters: peace you can drink</text><text x="1760" y="1010" text-anchor="end" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="28" fill="#9ca3af">2 / 4</text></svg>
